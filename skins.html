// ========== 认证检查 ==========
function getToken() { return localStorage.getItem('skinlib_token'); }
function getUser() {
  try { return JSON.parse(localStorage.getItem('skinlib_user') || 'null'); } catch { return null; }
}

function checkAuth() {
  const token = getToken();
  const user = getUser();
  if (!token) {
    window.location.href = 'login.html';
    return false;
  }
  document.getElementById('navUser').textContent = user ? user.username : '';
  document.getElementById('logoutBtn').style.display = user ? '' : 'none';
  return true;
}

function handleLogout() {
  localStorage.removeItem('skinlib_token');
  localStorage.removeItem('skinlib_user');
  window.location.href = 'login.html';
}

// ========== Tab / 筛选 ==========
function switchTab(type, el) {
  currentType = type;
  currentPage = 1;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.type === type));
  document.getElementById('modelField').style.display = type === 'skins' ? '' : 'none';
  render();
}

function onSearch() {
  currentSearch = document.getElementById('searchInput').value.trim();
  currentPage = 1;
  render();
}

function onSort() {
  currentSort = document.getElementById('sortSelect').value;
  currentPage = 1;
  render();
}

function goPage(delta) {
  currentPage += delta;
  render();
}

// ========== 渲染列表 ==========
async function render() {
  const area = document.getElementById('contentArea');
  const pag = document.getElementById('pag');

  if (!checkAuth()) return;

  area.innerHTML = `<div class="state-msg"><div class="spinner-lg"></div><div>加载中…</div></div>`;
  pag.style.display = 'none';

  try {
    const url = `${API}/${currentType}?page=${currentPage}&limit=24&sort=${currentSort}${currentSearch ? '&search=' + encodeURIComponent(currentSearch) : ''}`;
    const res = await fetch(url);
    const j = await res.json();

    if (!j.ok) throw new Error(j.error || '加载失败');

    const items = j.data || [];
    const totalPages = j.pages || 1;

    if (items.length === 0) {
      area.innerHTML = `<div class="state-msg"><i class="ti ti-search" style="font-size:40px;margin-bottom:12px;display:block"></i><div>暂无${currentType === 'skins' ? '皮肤' : '披风'}，点击「上传」发布第一个作品</div></div>`;
      return;
    }

    let html = '<div class="grid">';
    for (const it of items) {
      const imgUrl = `${BASE}${it.image_url}`;
      const priceHtml = it.price > 0
        ? `<span class="card-price"><i class="ti ti-currency-yen"></i>${it.price}</span>`
        : `<span class="card-free">免费</span>`;
      html += `
        <div class="card" onclick="openDetail(${JSON.stringify(it).replace(/<\/script>/g, '<\\/script>')})">
          <img class="card-img" src="${imgUrl}" alt="${esc(it.name)}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 3 4%22><rect fill=%22%230f3460%22 width=%223%22 height=%224%22/><text x=%221.5%22 y=%222%22 text-anchor=%22middle%22 fill=%22%238892a0%22 font-size=%221%22>?</text></svg>'">
          <div class="card-info">
            <div class="card-name">${esc(it.name)}</div>
            <div class="card-meta">
              ${priceHtml}
              <span><i class="ti ti-heart"></i> ${it.likes || 0}</span>
            </div>
          </div>
        </div>`;
    }
    html += '</div>';
    area.innerHTML = html;

    pag.style.display = 'flex';
    document.getElementById('prevBtn').disabled = currentPage <= 1;
    document.getElementById('nextBtn').disabled = currentPage >= totalPages;
    document.getElementById('pagInfo').textContent = `第 ${currentPage} / ${totalPages} 页`;

  } catch (err) {
    area.innerHTML = `<div class="state-msg error"><i class="ti ti-alert-circle" style="font-size:40px;margin-bottom:12px;display:block"></i><div>${esc(err.message)}</div></div>`;
  }
}

// ========== 详情拟态框 ==========
function openDetail(item) {
  currentItem = item;
  const modal = document.getElementById('detailModal');
  document.getElementById('detailImg').src = `${BASE}${item.image_url}`;
  document.getElementById('detailName').textContent = item.name;
  document.getElementById('detailDesc').textContent = item.description || '暂无描述';
  document.getElementById('detailDesc').style.minHeight = item.description ? 'auto' : '40px';

  const tags = [];
  if (item.price > 0) tags.push(`<span class="tag price"><i class="ti ti-currency-yen"></i>${item.price}</span>`);
  else tags.push(`<span class="tag free">免费</span>`);
  if (item.model) tags.push(`<span class="tag model">${item.model === 'slim' ? '纤细' : '经典'}</span>`);
  tags.push(`<span class="tag source">玩家上传</span>`);
  document.getElementById('detailTags').innerHTML = tags.join('');

  // 付款码
  const qrSection = document.getElementById('detailQr');
  const hasQr = !!(item.wechat_qr || item.alipay_qr);
  qrSection.style.display = hasQr ? '' : 'none';
  const wechatItem = document.getElementById('detailQrWechat');
  const alipayItem = document.getElementById('detailQrAlipay');
  if (item.wechat_qr) {
    wechatItem.style.display = '';
    document.getElementById('detailQrWechatImg').src = `${BASE}${item.wechat_qr}`;
  } else { wechatItem.style.display = 'none'; }
  if (item.alipay_qr) {
    alipayItem.style.display = '';
    document.getElementById('detailQrAlipayImg').src = `${BASE}${item.alipay_qr}`;
  } else { alipayItem.style.display = 'none'; }

  // 点赞状态
  const likeBtn = document.getElementById('detailLike');
  likeBtn.innerHTML = '<i class="ti ti-heart"></i> 点赞';
  likeBtn.classList.remove('liked');

  // 删除按钮（仅上传者可见）
  const user = getUser();
  const deleteBtn = document.getElementById('detailDelete');
  deleteBtn.style.display = (user && item.uploader_id === user.id) ? '' : 'none';

  modal.style.display = 'flex';
}

function closeDetail() {
  document.getElementById('detailModal').style.display = 'none';
  currentItem = null;
}

async function handleDownload() {
  if (!currentItem) return;
  const url = `${BASE}${currentItem.image_url}`;
  const a = document.createElement('a');
  a.href = url;
  a.download = currentItem.tid + '.png';
  a.click();
}

async function handleLike() {
  if (!currentItem) return;
  try {
    await fetch(`${API}/${currentType}s/${currentItem.tid}/like`, { method: 'POST' });
    const likeBtn = document.getElementById('detailLike');
    likeBtn.innerHTML = '<i class="ti ti-heart-filled"></i> 已点赞';
    likeBtn.classList.add('liked');
    currentItem.likes = (currentItem.likes || 0) + 1;
    render();
  } catch (err) {
    alert('点赞失败：' + err.message);
  }
}

async function handleDelete() {
  if (!currentItem) return;
  if (!confirm('确定要删除这个作品吗？此操作不可恢复。')) return;
  try {
    await fetch(`${API}/${currentType}s/${currentItem.tid}`, { method: 'DELETE' });
    closeDetail();
    render();
  } catch (err) {
    alert('删除失败：' + err.message);
  }
}

// ========== 上传 ==========
function openUploadModal() {
  if (!checkAuth()) return;
  document.getElementById('uploadForm').reset();
  document.getElementById('uploadError').textContent = '';
  document.getElementById('fileError').textContent = '';
  uploadedFileData = null;
  qrFiles = { wechat: null, alipay: null };
  document.getElementById('qrPrev1').style.display = 'none';
  document.getElementById('qrPrev2').style.display = 'none';
  setPayType('free');
  document.getElementById('uploadModal').style.display = 'flex';
}

function closeUpload() {
  document.getElementById('uploadModal').style.display = 'none';
}

function previewFile(input) {
  const err = document.getElementById('fileError');
  err.textContent = '';
  if (!input.files || !input.files[0]) return;
  const file = input.files[0];
  if (file.size > 5 * 1024 * 1024) { err.textContent = '文件不能超过 5MB'; input.value = ''; return; }
  const validTypes = ['image/png', 'image/jpeg', 'image/webp'];
  if (!validTypes.includes(file.type)) { err.textContent = '仅支持 PNG / JPEG / WebP'; input.value = ''; return; }
  uploadedFileData = file;
  document.querySelector('#fileDrop .drop-label').innerHTML =
    `<span class="icon"><i class="ti ti-check"></i></span>${esc(file.name)}<br><small>点击更换</small>`;
}

function previewQr(input, imgId, qrType) {
  if (!input.files || !input.files[0]) return;
  qrFiles[qrType] = input.files[0];
  const img = document.getElementById(imgId);
  const reader = new FileReader();
  reader.onload = e => { img.src = e.target.result; img.style.display = 'block'; };
  reader.readAsDataURL(input.files[0]);
}

function setPayType(type) {
  payType = type;
  document.querySelectorAll('.pay-type-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.pay === type));
  const qrSection = document.getElementById('qrSection');
  const qrItem2 = document.getElementById('qrItem2');
  if (type === 'free') {
    qrSection.style.display = 'none';
  } else {
    qrSection.style.display = '';
    qrItem2.style.display = type === 'both' ? '' : 'none';
  }
}

async function handleSubmitUpload(e) {
  e.preventDefault();
  const errEl = document.getElementById('uploadError');
  errEl.textContent = '';

  if (!uploadedFileData) { errEl.textContent = '请选择图片文件'; return false; }

  const name = document.getElementById('uploadName').value.trim();
  const desc = document.getElementById('uploadDesc').value.trim();
  const model = document.getElementById('uploadModel').value;

  const fd = new FormData();
  fd.append('file', uploadedFileData);
  fd.append('name', name);
  fd.append('description', desc);
  fd.append('model', model);
  if (payType === 'one' || payType === 'both') {
    fd.append('price', '1');
  }
  // 付款码（如果有）
  if (qrFiles.wechat) fd.append('wechat_qr', qrFiles.wechat);
  if (qrFiles.alipay) fd.append('alipay_qr', qrFiles.alipay);

  const token = getToken();
  const btn = document.getElementById('submitUploadBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader"></i> 上传中…';

  try {
    const res = await fetch(`${API}/${currentType}s`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}` },
      body: fd
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || '上传失败');

    closeUpload();
    currentPage = 1;
    render();
  } catch (err) {
    errEl.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-upload"></i> 确认上传';
  }
  return false;
}

// ========== 工具 ==========
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ========== 初始化 ==========
document.addEventListener('DOMContentLoaded', () => {
  if (!checkAuth()) return;
  render();
});
</script>
