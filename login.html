<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · Allay Launcher 皮肤库</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  :root {
    --bg: #1a1a2e;
    --bg2: #16213e;
    --surface: #0f3460;
    --accent: #53d769;
    --accent2: #3aaf5c;
    --text: #e0e0e0;
    --muted: #8892a0;
    --border: #2a3a52;
    --danger: #e74c3c;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .logo-area { text-align: center; margin-bottom: 24px; }
  .logo-area img { width: 64px; height: 64px; border-radius: 14px; margin-bottom: 10px; object-fit: cover; box-shadow: 0 4px 20px rgba(83,215,105,.25); }
  .logo-area h1 { font-size: 24px; font-weight: 800; color: var(--accent); }
  .logo-area p { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    width: 100%;
    max-width: 400px;
  }
  .card h2 { font-size: 20px; margin-bottom: 20px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .card h2 i { font-size: 20px; color: var(--accent); }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
  .field label i { font-size: 14px; color: var(--accent); }
  .field input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  .field input:focus { border-color: var(--accent); }

  .btn {
    width: 100%;
    background: var(--accent);
    color: #000;
    border: none;
    padding: 12px;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background .2s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:hover { background: var(--accent2); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn i { font-size: 16px; }

  .error-msg {
    color: var(--danger);
    font-size: 13px;
    margin-top: 8px;
    text-align: center;
    min-height: 20px;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .error-msg i { font-size: 14px; }

  .footer-links {
    margin-top: 20px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }
  .footer-links a { color: var(--accent); }

  .back-link {
    display: inline-flex; align-items: center; gap: 4px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
  }
  .back-link:hover { color: var(--accent); text-decoration: none; }
  .back-link i { font-size: 15px; }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="logo-area">
  <img src="logo.png" alt="Allay">
  <h1>Allay Launcher</h1>
  <p>悦灵启动器 · 皮肤库</p>
</div>

<a class="back-link" href="index.html"><i class="ti ti-arrow-left"></i>返回首页</a>

<div class="card">
  <h2><i class="ti ti-login"></i>登录账号</h2>
  <form id="loginForm" onsubmit="return handleLogin(event)">
    <div class="field">
      <label for="username"><i class="ti ti-user"></i>用户名 / 邮箱</label>
      <input id="username" type="text" autocomplete="username" required placeholder="输入用户名或邮箱">
    </div>
    <div class="field">
      <label for="password"><i class="ti ti-lock"></i>密码</label>
      <input id="password" type="password" autocomplete="current-password" required placeholder="输入密码">
    </div>
    <div class="error-msg" id="errMsg"></div>
    <button class="btn" type="submit" id="submitBtn"><i class="ti ti-login"></i>登录</button>
  </form>
  <div class="footer-links">
    还没有账号？<a href="reg.html">立即注册</a>
  </div>
</div>

<script>
const API = 'https://api.allay.cc.cd';

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('errMsg');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>登录中…';
  msg.textContent = '';

  try {
    const res = await fetch(API + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || '登录失败');

    localStorage.setItem('skinlib_token', j.token);
    localStorage.setItem('skinlib_user', JSON.stringify(j.user));
    window.location.href = 'skins.html';
  } catch (err) {
    msg.innerHTML = '<i class="ti ti-alert-circle"></i>' + err.message;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-login"></i>登录';
  }
  return false;
}

if (localStorage.getItem('skinlib_token')) {
  window.location.href = 'skins.html';
}
</script>

</body>
</html>
